name: frontend-mirror-parity

# react 端 transport 真源已移入 @go-wind/admin-react 包（go-wind-ui 仓），
# 本仓只保留 vue 两端的镜像互检（见 scripts/check-frontend-mirror.mjs 头注释）。

on:
  push:
    paths:
      - 'frontend/admin/vue-element/src/core/transport/sse/**'
      - 'frontend/admin/vue-vben/src/transport/sse/**'
      - 'frontend/admin/vue-element/src/core/transport/rest/pagination.ts'
      - 'frontend/admin/vue-element/src/core/transport/rest/preset-interceptors.ts'
      - 'scripts/check-frontend-mirror.mjs'
  pull_request:
    paths:
      - 'frontend/admin/vue-element/src/core/transport/sse/**'
      - 'frontend/admin/vue-vben/src/transport/sse/**'
      - 'frontend/admin/vue-element/src/core/transport/rest/pagination.ts'
      - 'frontend/admin/vue-element/src/core/transport/rest/preset-interceptors.ts'
      - 'scripts/check-frontend-mirror.mjs'

jobs:
  frontend-mirror-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-frontend-mirror.mjs
