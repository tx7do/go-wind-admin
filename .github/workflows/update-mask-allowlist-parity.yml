name: update-mask-allowlist-parity

on:
  push:
    paths:
      - 'frontend/admin/react/src/**'
      - 'frontend/admin/vue-element/src/**'
      - 'frontend/admin/vue-vben/src/**'
      - 'scripts/check-update-mask-allowlists.mjs'
  pull_request:
    paths:
      - 'frontend/admin/react/src/**'
      - 'frontend/admin/vue-element/src/**'
      - 'frontend/admin/vue-vben/src/**'
      - 'scripts/check-update-mask-allowlists.mjs'

jobs:
  update-mask-allowlist-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-update-mask-allowlists.mjs
