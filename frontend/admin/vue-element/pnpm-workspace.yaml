# pnpm v12 构建审批（allowBuilds）：下列依赖一律不执行 install 脚本。
# 与既有 node_modules 的实际安装行为一致；二进制经 optional 平台包分发，跳过安全。
allowBuilds:
  '@parcel/watcher': false
  es5-ext: false
  esbuild: false
  json-editor-vue: false
  vue-demi: false
minimumReleaseAgeExclude:
  - '@worm-vue3-print/canvas@1.3.11'
  - '@worm-vue3-print/core@1.3.11'
