<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="A Modern Back-end Management System" />
    <meta name="keywords" content="GoWind Admin React AntD Vite" />
    <meta name="author" content="GoWind" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <!-- 由 vite 注入 VITE_APP_TITLE 变量，在 .env 文件内配置 -->
    <title>%VITE_APP_TITLE%</title>
    <link rel="icon" href="/favicon.ico" />
    <!--
      预绘制主题注入（必须保持同步、位于 head 内）：
      React 启动前先从 localStorage('app-preferences') 读取持久化的主题 mode，
      立即在 <html> 上设置 data-theme 与页面底色，避免每次刷新先闪默认背景
      再被 ThemeProvider 纠正（底色竞态/闪烁）。
      底色常量须与 src/core/preferences/config/darkTheme.ts 保持一致：
      dark=#0B0F19，light=#f5f5f5。
    -->
    <script>
      (function () {
        var DARK_BG = '#0B0F19';
        var LIGHT_BG = '#f5f5f5';
        var mode = 'dark'; // 与 defaultPreferences.theme.mode 默认值一致
        try {
          var raw = window.localStorage.getItem('app-preferences');
          if (raw) {
            var saved = JSON.parse(raw);
            var m =
              saved &&
              saved.state &&
              saved.state.preferences &&
              saved.state.preferences.theme &&
              saved.state.preferences.theme.mode;
            if (m === 'light' || m === 'dark' || m === 'auto') mode = m;
          }
        } catch (e) {
          /* 解析失败回退默认 dark */
        }
        if (mode === 'auto') {
          mode =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        var bg = mode === 'dark' ? DARK_BG : LIGHT_BG;
        var root = document.documentElement;
      root.setAttribute('data-theme', mode);
      root.style.backgroundColor = bg;
    })();
    </script>
    <!--
      启动加载页样式：覆盖 React 挂载前的窗口期（bundle 下载/执行 + main.tsx 顶层
      await + bootstrap() 的 i18n 初始化与会话恢复），否则这段期间页面只有一块纯色。
      React createRoot 首帧渲染会整体替换 #root 内容，加载节点随之消失，无需手动清理
      （与 vue-element / vue-vben 的 index.html 静态加载页同一手法）。
      底色保持透明——html 底色已由上方预绘制脚本按主题铺好；
      加载条主色与 src/core/preferences/config/default.ts 的 colorPrimary（hsl(212 100% 45%)）一致。
    -->
    <style>
      .app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }

      .app-loading-title {
        color: rgba(255, 255, 255, 0.85);
        font-size: 20px;
        font-weight: 600;
      }

      html[data-theme='light'] .app-loading-title {
        color: rgba(0, 0, 0, 0.85);
      }

      .app-loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 40px;
      }

      .app-loading-bar {
        width: 4px;
        height: 24px;
        background-color: hsl(212 100% 45%);
        border-radius: 2px;
        animation: app-loading-bar-ani 1.2s ease-in-out infinite;
      }

      .app-loading-bar:nth-child(1) {
        animation-delay: 0s;
      }

      .app-loading-bar:nth-child(2) {
        animation-delay: 0.2s;
      }

      .app-loading-bar:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes app-loading-bar-ani {
        0% {
          opacity: 0.3;
          transform: scaleY(0.5);
        }

        50% {
          opacity: 1;
          transform: scaleY(1.2);
        }

        100% {
          opacity: 0.3;
          transform: scaleY(0.5);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status">
        <div class="app-loading-spinner">
          <div class="app-loading-bar"></div>
          <div class="app-loading-bar"></div>
          <div class="app-loading-bar"></div>
        </div>
        <div class="app-loading-title">%VITE_APP_TITLE%</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
