        LoginAuditLog:
            type: object
            properties:
                id:
                    type: integer
                    description: 登录审计日志ID
                    format: uint32
                tenantId:
                    type: integer
                    description: 租户ID
                    format: uint32
                tenantName:
                    type: string
                    description: 租户名称
                userId:
                    type: integer
                    description: 用户ID
                    format: uint32
                username:
                    type: string
                    description: 账号名
                ipAddress:
                    type: string
                    description: IP地址
                geoLocation:
                    $ref: '#/components/schemas/GeoLocation'
                sessionId:
                    type: string
                    description: 会话ID
                deviceInfo:
                    $ref: '#/components/schemas/DeviceInfo'
                requestId:
                    type: string
                    description: 全局请求ID（关联网关日志）
                traceId:
                    type: string
                    description: 全局链路追踪ID
                actionType:
                    enum:
                        - ACTION_TYPE_UNSPECIFIED
                        - LOGIN
                        - LOGOUT
                        - SESSION_EXPIRED
                        - KICKED_OUT
                        - PASSWORD_RESET
                    type: string
                    description: 事件动作类型
                    format: enum
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - SUCCESS
                        - FAILED
                        - PARTIAL
                        - LOCKED
                    type: string
                    description: 操作结果状态
                    format: enum
                failureReason:
                    type: string
                    description: 失败原因：密码错误/MFA验证失败/IP黑名单等
                mfaStatus:
                    type: string
                    description: MFA状态：UNVERIFIED/VERIFYING/VERIFIED/FAILED
                loginMethod:
                    enum:
                        - LOGIN_METHOD_UNSPECIFIED
                        - PASSWORD
                        - SMS_CODE
                        - QR_CODE
                        - OIDC_SOCIAL
                        - BIOMETRIC
                        - FIDO2
                    type: string
                    description: 登录方式
                    format: enum
                riskScore:
                    type: integer
                    description: 风险评分（0-100，分值越高风险越大）
                    format: uint32
                riskLevel:
                    enum:
                        - RISK_LEVEL_UNSPECIFIED
                        - LOW
                        - MEDIUM
                        - HIGH
                    type: string
                    description: 风险等级（高风险需实时告警）
                    format: enum
                riskFactors:
                    type: array
                    items:
                        type: string
                    description: 风险因素（ISO 27001标准，如：异地登录/新设备/密码尝试次数过多）
                logHash:
                    type: string
                    description: 日志内容哈希（SHA256，十六进制字符串）
                signature:
                    type: string
                    description: 日志数字签名（ECDSA，签名内容：tenant_id+user_id+created_at+log_hash）
                    format: bytes
                createdAt:
                    type: string
                    description: 日志创建时间
                    format: date-time
            description: 登录审计日志
        LoginPolicy:
            type: object
            properties:
                id:
                    type: integer
                    description: 登录策略ID
                    format: uint32
                targetId:
                    type: integer
                    description: 目标用户ID
                    format: uint32
                type:
                    enum:
                        - LOGIN_RESTRICTION_TYPE_UNSPECIFIED
                        - BLACKLIST
                        - WHITELIST
                    type: string
                    description: 限制类型
                    format: enum
                method:
                    enum:
                        - LOGIN_RESTRICTION_METHOD_UNSPECIFIED
                        - IP
                        - MAC
                        - REGION
                        - TIME
                        - DEVICE
                    type: string
                    description: 限制方式
                    format: enum
                value:
                    type: string
                    description: 限制值（如IP地址、MAC地址或地区代码）
                reason:
                    type: string
                    description: 限制原因
                tenantId:
                    type: integer
                    description: 租户ID，0代表系统全局角色
                    format: uint32
                tenantName:
                    type: string
                    description: 租户名称
                createdBy:
                    type: integer
                    description: 创建者ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 登录策略
        LoginRequest:
            required:
                - grant_type
            type: object
            properties:
                grant_type:
                    enum:
                        - password
                        - client_credentials
                        - authorization_code
                        - refresh_token
                        - implicit
                    type: string
                    default: password
                    description: 授权类型，此处的值固定为"password"，必选项。
                    format: enum
                client_id:
                    type: string
                    description: 客户端ID
                client_secret:
                    type: string
                    description: 客户端密钥
                scope:
                    type: string
                    description: 以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。
                redirect_uri:
                    type: string
                    description: 跳转链接
                user_id:
                    type: integer
                    description: 用户ID
                    format: uint32
                username:
                    type: string
                    description: 用户名
                email:
                    type: string
                    description: 电子邮件地址
                mobile:
                    type: string
                    description: 手机号
                password:
                    type: string
                    description: 用户的密码
                refresh_token:
                    type: string
                    description: 更新令牌，用来获取下一次的访问令牌，可选项。如果访问令牌将过期，则返回刷新令牌很有用，应用程序可以使用该刷新令牌来获取另一个访问令牌。但是，通过隐式授予颁发的令牌不能颁发刷新令牌。
                code:
                    type: string
                    description: 授权请求中收到的一次性验证/认证码。(当使用授权码模式时)
                client_type:
                    enum:
                        - admin
                        - app
                    type: string
                    description: 客户端类型
                    format: enum
                device_id:
                    type: string
                    description: 设备唯一标识（可选），用于设备绑定、推送、风控等
                jti:
                    type: string
                    description: 建议客户端生成并提供 jti（JWT ID）作为唯一标识，服务端可据此防止重放攻击
                tenant_code:
                    type: string
                    description: 租户编号，留空表示平台登录（平台超级管理员）；非空时按该编号解析对应租户
            description: 用户后台登录 - 请求
        LoginResponse:
            type: object
            properties:
                token_type:
                    enum:
                        - bearer
                        - mac
                    type: string
                    default: Bearer
                    description: 令牌的类型，该值大小写不敏感，必选项，可以是bearer类型或mac类型，通常只是字符串“Bearer”。
                    format: enum
                access_token:
                    type: string
                    description: 访问令牌，必选项。授权服务器颁发的访问令牌字符串。
                expires_in:
                    type: string
                    description: 访问令牌过期时间（秒）
                scope:
                    type: string
                    description: 以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。
                id_token:
                    type: string
                    description: ID 令牌，OpenID Connect 扩展中定义的 JWT 格式令牌
                mfa_operation_id:
                    type: string
                    description: MFA 挑战操作标识。非空表示登录需二次验证，此时 access_token 为空。
            description: 用户后台登录 - 回应
