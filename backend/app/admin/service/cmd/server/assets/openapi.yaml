tags:
    - name: AccessKeyService
      description: OpenAPI 访问凭证（AK/SK）管理 — BFF
    - name: AdminPortalService
      description: 后台前端初始化数据与配置服务
    - name: AiAgentService
      description: AI Agent 编排管理服务（可视化画布）
    - name: AiChatService
      description: |-
        AI 对话服务

         流式语义：本 RPC 是普通 POST（body 为扁平请求体，**不包 data**），
         增量 token 经 SSE `ai_chat_chunk` 事件推送（见 domain proto 注释）。
    - name: AiContentService
      description: AI 内容生成服务（表单助手）
    - name: AiConversationService
      description: AI 对话会话管理服务
    - name: AiKnowledgeBaseService
      description: AI 知识库管理服务（RAG）
    - name: AiMessageService
      description: AI 对话消息服务
    - name: AiProviderService
      description: AI 模型提供商管理服务
    - name: AiQueryService
      description: |-
        智能问数服务（NL → 只读 SQL → 结构化结果）
         平台管理员专属：第一版查的是全平台数据，且 SQL 会触达原生库表。
    - name: AiUsageLogService
      description: AI 用量流水服务（配额记账事实源）
    - name: ApiAuditLogService
      description: API审计日志管理服务
    - name: ApiService
      description: API资源管理服务
    - name: AuthenticationService
      description: 用户后台登录认证服务
    - name: ConfigService
      description: 系统参数管理服务
    - name: DashboardService
      description: 后台首页分析概览服务（只读聚合）
    - name: DataAccessAuditLogService
      description: 数据访问审计日志管理服务
    - name: DictEntryService
      description: 数据字典条目管理服务
    - name: DictTypeService
      description: 数据字典分类管理服务
    - name: FileService
      description: 文件管理服务
    - name: FileTransferService
      description: 文件传输服务
    - name: InternalMessageCategoryService
      description: 站内信消息分类管理服务
    - name: InternalMessageRecipientService
      description: 站内信消息管理服务
    - name: InternalMessageService
      description: 站内信消息管理服务
    - name: LanguageService
      description: 语言管理服务
    - name: LoginAuditLogService
      description: 登录审计日志管理服务
    - name: LoginPolicyService
      description: 登录策略管理服务
    - name: MenuService
      description: 后台菜单管理服务
    - name: MfaService
      description: |-
        MFA（多因素认证）服务 HTTP 桥接。
         管理侧 RPC（GetMFAStatus/ListEnrolledMethods/StartEnrollMethod/ConfirmEnrollMethod/
         DisableMFA/RevokeMFADevice）需登录态，走正常 auth+authz 中间件，不加 security:{}。
         登录挑战侧 RPC（VerifyMFAChallenge）免鉴权，加 security:{} 并加入 rest_server 白名单。
    - name: MonitorAlertService
      description: 监控告警规则服务（平台管理员）
    - name: MyTenantUsageService
      description: |-
        租户自助用量服务：租户管理员查看本租户的套餐用量与配额。
         与 TenantService.GetUsage（平台管理员按租户 ID 查任意租户）互补——
         本服务 server 钉定 operator 的租户，不接受客户端传入租户 ID。
    - name: NotificationChannelService
      description: 通知渠道管理服务（平台级配置）
    - name: NotificationPreferenceService
      description: 用户通知偏好服务（自助：读写的都是当前操作人自己的偏好，无管理面）。
    - name: NotificationRuleService
      description: 通知路由规则管理服务（平台级配置，菜单 authority 为 sys:platform_admin）。
    - name: NotificationService
      description: |-
        通知投递台账管理服务（平台级只读视图）。

         本域不含"发一条通知"的通用 HTTP 路由：SendDirect 只由进程内的业务 service 经 Notifier 接口调用。
         把它开放成端点等于给任意已登录操作员一个"向任意邮箱发信"的能力。
         两个刻意保留的手动触发口都是平台管理员专属、且只能发"测试文案"：
         渠道配置页的 send-test-email，与路由规则页的 notification-rules/{id}/test-dispatch。
    - name: NotificationTemplateService
      description: 通知模板管理服务（平台管理员；租户由 notification_platform_guard 拒绝）
    - name: OnlineSessionService
      description: 在线会话管理服务（在线用户列表 + 强制下线）
    - name: OperationAuditLogService
      description: 操作审计日志管理服务
    - name: OrgUnitService
      description: 组织单元服务
    - name: PermissionAuditLogService
      description: 权限变更审计日志服务
    - name: PermissionGroupService
      description: 权限组管理服务
    - name: PermissionService
      description: 权限点管理服务
    - name: PlanModuleService
      description: 套餐模块白名单管理服务
    - name: PlanQuotaService
      description: 套餐配额管理服务
    - name: PlanService
      description: 套餐管理服务
    - name: PolicyEvaluationLogService
      description: 策略评估日志服务
    - name: PositionService
      description: 职位管理服务
    - name: PrintTemplateService
      description: 打印模板管理服务
    - name: RedisCacheMonitorService
      description: Redis缓存监控管理服务（只读）
    - name: RoleService
      description: 角色管理服务
    - name: ScriptLogService
      description: 脚本执行日志管理服务（平台管理员）
    - name: ScriptService
      description: 脚本管理服务（平台管理员）
    - name: ServerMonitorService
      description: 服务监控管理服务（只读）
    - name: TaskMonitorService
      description: 系统级常驻任务监控服务（平台管理员；只读 asynq Inspector，无副作用）。
    - name: TaskService
      description: 调度任务管理服务
    - name: TenantService
      description: 租户管理服务
    - name: UserProfileService
      description: 用户个人资料服务
    - name: UserService
      description: 用户管理服务
