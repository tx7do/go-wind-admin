                    type: string
                    description: 备注
                tenantId:
                    type: integer
                    description: 租户ID，0代表系统全局角色
                    format: uint32
                createdBy:
                    type: integer
                    description: 创建者ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
