components:
    schemas:
        AccessKey:
            type: object
            properties:
                id:
                    type: integer
                    description: 凭证ID
                    format: uint32
                name:
                    type: string
                    description: 凭证名称（用途说明）
                accessKey:
                    type: string
                    description: 访问键（AK，公开标识，调用时随令牌交换请求上送）
                status:
                    enum:
                        - OFF
                        - ON
                    type: string
                    description: 凭证状态（停用后令牌交换被拒绝）
                    format: enum
                expiresAt:
                    type: string
                    description: 过期时间（留空表示长期有效）
                    format: date-time
                lastUsedAt:
                    type: string
                    description: 最近一次令牌交换时间
                    format: date-time
                tenantId:
                    type: integer
                    description: 归属租户ID（机器令牌继承该租户的隔离与闸门）
                    format: uint32
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: OpenAPI 访问凭证（AK/SK）
        ActionDistributionResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/DistributionItem'
            description: 操作类型分布 - 回应
        AiAgentApp:
            type: object
            properties:
                id:
                    type: integer
                    description: 应用ID
                    format: uint32
                name:
                    type: string
                    description: 应用名称（租户内唯一）
                description:
                    type: string
                    description: 应用描述
                graph:
                    type: string
                    description: 图 DSL（JSON 文本）
                enabled:
                    type: boolean
                    description: 是否启用（停用的应用拒绝运行）
                tenantId:
                    type: integer
                    description: 创建/更新入参带出（与 AiConversation 同口径）：租户隔离 mixin 无创建钩子，租户必须显式写
                    format: uint32
                createdBy:
                    type: integer
                    format: uint32
                updatedBy:
                    type: integer
                    format: uint32
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: Agent 编排应用
        AiAgentRun:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                appId:
                    type: integer
                    format: uint32
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - RUNNING
                        - SUCCEEDED
                        - FAILED
                    type: string
                    format: enum
                input:
                    type: string
                    description: 运行入参（JSON 对象：start 节点 inputVars 的 name → 值）
                output:
                    type: string
                error:
                    type: string
                trace:
                    type: string
                    description: 逐节点执行轨迹（JSON 数组：{nodeId,type,status,ms,summary,usage}）
                promptTokens:
                    type: integer
                    format: uint32
                completionTokens:
                    type: integer
                    format: uint32
                totalTokens:
                    type: integer
                    format: uint32
                durationMs:
                    type: integer
                    format: uint32
                createdAt:
                    type: string
                    format: date-time
            description: Agent 运行记录
        AiConversation:
            type: object
            properties:
                id:
                    type: integer
                    description: 会话ID
                    format: uint32
                title:
                    type: string
                    description: 会话标题（默认取首条消息摘要）
                providerId:
                    type: integer
                    description: 会话使用的提供商ID（0 表示未指定）
                    format: uint32
                userId:
                    type: integer
                    description: 归属用户ID
                    format: uint32
                tenantId:
                    type: integer
                    description: 租户ID
                    format: uint32
                lastMessageAt:
                    type: string
                    description: 最近一条消息时间
                    format: date-time
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: AI 对话会话
        AiDoc:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                baseId:
                    type: integer
                    format: uint32
                name:
                    type: string
                chunkCount:
                    type: integer
                    format: uint32
                status:
                    type: string
                errorMessage:
                    type: string
                userId:
                    type: integer
                    format: uint32
                tenantId:
                    type: integer
                    format: uint32
                createdAt:
                    type: string
                    format: date-time
            description: AI 文档
        AiInsightAlert:
            type: object
            properties:
                severity:
                    type: string
                type:
                    type: string
                facts:
                    type: object
                    additionalProperties:
                        type: string
                    description: 插值参数（i18n 模板变量）：username / count / total / ip 等，键随 type 而定
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/AiSensitiveOpItem'
                    description: SENSITIVE_OPS 专用的明细行（username + action + 资源与时间由前端格式化）
            description: |-
                异常告警条目：规则预筛的确定性结构化事实，**不含人类文案**——
                 文案由前端按 type 选 i18n 模板并以 facts 插值渲染，保证多语言界面一致
        AiInsightsRequest:
            type: object
            properties:
                lang:
                    type: string
                    description: |-
                        界面语言（BCP-47，如 zh-CN / en-US），决定 LLM 总评的输出语言；
                         告警本身只回传结构化事实，文案由前端 i18n 模板渲染
            description: AI 概览解读 - 请求
        AiInsightsResponse:
            type: object
            properties:
                alerts:
                    type: array
                    items:
                        $ref: '#/components/schemas/AiInsightAlert'
                summary:
                    type: string
            description: AI 概览解读 - 回应
        AiKnowledgeBase:
            type: object
            properties:
                id:
                    type: integer
                    description: 知识库ID
                    format: uint32
                name:
                    type: string
                    description: 知识库名称
                description:
                    type: string
                    description: 描述
                providerId:
                    type: integer
                    description: 向量化使用的模型提供商ID（其端点须支持 OpenAI 兼容 /v1/embeddings）
                    format: uint32
                embeddingModel:
                    type: string
                    description: embedding 模型名，如 text-embedding-3-small
                userId:
                    type: integer
                    description: 创建人用户ID
                    format: uint32
                tenantId:
                    type: integer
                    description: 租户ID（0=平台级）
                    format: uint32
                docCount:
                    type: integer
                    description: 文档数（读视图）
                    format: uint32
                createdBy:
                    type: integer
                    format: uint32
                updatedBy:
                    type: integer
                    format: uint32
                deletedBy:
                    type: integer
                    format: uint32
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                deletedAt:
                    type: string
                    format: date-time
            description: AI 知识库
        AiMessage:
            type: object
            properties:
                id:
                    type: integer
                    description: 消息ID
                    format: uint32
                conversationId:
                    type: integer
                    description: 所属会话ID
                    format: uint32
                role:
                    enum:
                        - AI_ROLE_UNSPECIFIED
                        - USER
                        - ASSISTANT
                        - SYSTEM
                    type: string
                    description: 消息角色
                    format: enum
                content:
                    type: string
                    description: 消息正文（Markdown）
                modelName:
                    type: string
                    description: 生成该回复的模型名称快照
                promptTokens:
                    type: integer
                    description: 输入 token 数
                    format: uint32
                completionTokens:
                    type: integer
                    description: 输出 token 数
                    format: uint32
                durationMs:
                    type: integer
                    description: 生成耗时（毫秒）
                    format: uint32
                errorMessage:
                    type: string
                    description: 生成失败原因（仅失败记录）
                userId:
                    type: integer
                    description: 归属用户ID
                    format: uint32
                tenantId:
                    type: integer
                    description: 租户ID
                    format: uint32
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: AI 对话消息
        AiProvider:
            type: object
            properties:
                id:
                    type: integer
                    description: 提供商ID
                    format: uint32
                name:
                    type: string
                    description: 提供商显示名称，如 DeepSeek、通义千问、本地 Ollama
                modelType:
                    enum:
                        - MODEL_TYPE_UNSPECIFIED
                        - LOCAL
                        - CLOUD
                    type: string
                    description: 模型部署形态：本地 / 云端
                    format: enum
                modelName:
                    type: string
                    description: 模型名称，如 deepseek-chat、qwen-max、llama3
                baseUrl:
                    type: string
                    description: 云端 OpenAI 兼容 API 地址，如 https://api.deepseek.com/v1
                organization:
                    type: string
                    description: OpenAI Organization（可选）
                apiKey:
                    type: string
                    description: API Key（仅写入；读取时恒为空，脱敏值见 apiKeyHint）
                apiKeyHint:
                    type: string
                    description: API Key 脱敏提示（如 sk-***abcd），只读
                localHost:
                    type: string
                    description: 本地模型主机（Ollama），默认 localhost
                localPort:
                    type: integer
                    description: 本地模型端口，默认 11434
                    format: int32
                timeoutSeconds:
                    type: integer
                    description: 连接超时秒数（默认 30）；流式对话时长由服务端统一控制
                    format: int32
                systemPrompt:
                    type: string
                    description: 系统提示词（可选），作为对话的 system 消息
                isDefault:
                    type: boolean
                    description: 是否为默认提供商（聊天未显式指定时使用）
                remark:
                    type: string
                    description: 备注
                isEnabled:
                    type: boolean
                    description: 是否启用
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: AI 模型提供商（一行 = 一个可调用的模型端点配置）
        AiQueryHistoryItem:
            type: object
            properties:
                question:
                    type: string
                sql:
                    type: string
                resultSummary:
                    type: string
            description: 对话历史一轮（多轮追问用）：只回传问答摘要，供模型消解指代（如"那只看 admin 的"）
        AiQueryRow:
            type: object
            properties:
                values:
                    type: array
                    items:
                        type: string
            description: 结果行（values 与 columns 下标对应；时间/数字均已格式化为字符串）
        AiSensitiveOpItem:
            type: object
            properties:
                username:
                    type: string
                action:
                    type: string
                resourceType:
                    type: string
                createdAt:
                    type: string
            description: 敏感操作明细项
        AiUsageLog:
            type: object
            properties:
                id:
                    type: integer
                    description: 流水ID
                    format: uint32
                providerId:
                    type: integer
                    description: 提供商ID
                    format: uint32
                conversationId:
                    type: integer
                    description: 会话ID（0 表示非对话调用）
                    format: uint32
                userId:
                    type: integer
                    description: 发起用户ID
                    format: uint32
                tenantId:
                    type: integer
                    description: 租户ID（0 表示平台自用）
                    format: uint32
                modelName:
                    type: string
                    description: 模型名称
                promptTokens:
                    type: integer
                    description: 输入 token 数
                    format: uint32
                completionTokens:
                    type: integer
                    description: 输出 token 数
                    format: uint32
                totalTokens:
                    type: integer
                    description: 总 token 数
                    format: uint32
                durationMs:
                    type: integer
                    description: 调用耗时（毫秒）
                    format: uint32
                createdAt:
                    type: string
                    description: 调用时间
                    format: date-time
            description: AI 调用用量流水（每次成功的模型调用一行；配额按 total_tokens 聚合）
        Api:
            type: object
            properties:
                id:
                    type: integer
                    description: 资源ID
                    format: uint32
                operation:
                    type: string
                    description: 接口操作名
                path:
                    type: string
                    description: 接口路径
                method:
                    type: string
                    description: 请求方法（GET/POST/PUT/DELETE）
                module:
                    type: string
                    description: 所属业务模块（如 “用户管理”“支付系统”）
                moduleDescription:
                    type: string
                    description: 模块描述
                businessModule:
                    enum:
                        - MODULE_UNSPECIFIED
                        - DASHBOARD
                        - OPM
                        - SYSTEM
                        - DICT
                        - TENANT
                        - PERMISSION
                        - LOG
                        - INTERNAL_MESSAGE
                        - FILE
                        - TASK
                        - AI
                    type: string
                    description: 所属业务功能模块（用于套餐白名单过滤）
                    format: enum
                description:
                    type: string
                    description: 描述
                scope:
                    enum:
                        - API_SCOPE_INVALID
                        - ADMIN
                        - APP
                    type: string
                    description: 作用域
                    format: enum
                status:
                    enum:
                        - OFF
                        - ON
                    type: string
                    description: 状态
                    format: enum
                createdBy:
                    type: integer
                    description: 创建者ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: API资源
        ApiAuditLog:
            type: object
            properties:
                id:
                    type: integer
                    description: 接口审计日志ID
                    format: uint32
                tenantId:
                    type: integer
                    description: 租户ID
                    format: uint32
                tenantName:
                    type: string
                    description: 租户名称
                userId:
                    type: integer
                    description: 用户ID
                    format: uint32
                username:
                    type: string
                    description: 账号名
                ipAddress:
                    type: string
                    description: IP地址
                geoLocation:
                    $ref: '#/components/schemas/GeoLocation'
                deviceInfo:
                    $ref: '#/components/schemas/DeviceInfo'
                referer:
                    type: string
                    description: 请求来源URL
                appVersion:
                    type: string
                    description: 客户端版本号
                httpMethod:
                    type: string
                    description: HTTP请求方法（GET/POST/PUT/DELETE）
                path:
                    type: string
                    description: 请求路径（不含参数，如/api/v1/users）
                requestUri:
                    type: string
                    description: 完整请求URI（含参数，如/api/v1/users?id=1）
                apiModule:
                    type: string
                    description: API所属业务模块（如user/permission/order）
                apiOperation:
                    type: string
                    description: API业务操作（如查询用户/创建订单，非HTTP方法）
                apiDescription:
                    type: string
                    description: API功能描述（如“根据ID查询单个用户信息”）
                requestId:
                    type: string
                    description: 全局请求ID（关联网关日志）
                traceId:
                    type: string
                    description: 全局链路追踪ID（符合W3C TraceContext标准）
                spanId:
                    type: string
                    description: 当前跨度ID
                latencyMs:
                    type: integer
                    description: API耗时（毫秒）
                    format: uint32
                success:
                    type: boolean
                    description: 操作是否成功
                statusCode:
                    type: integer
                    description: HTTP状态码（200/403/500）
                    format: uint32
                reason:
                    type: string
                    description: 操作失败原因（仅success=false时填充）
                requestHeader:
                    type: string
                    description: 请求头（JSON格式，敏感字段脱敏后）
                requestBody:
                    type: string
                    description: 请求体（JSON格式，敏感字段脱敏后）
                response:
                    type: string
                    description: 响应信息（JSON格式，敏感字段脱敏后）
                logHash:
                    type: string
                    description: 日志内容哈希（SHA256，十六进制字符串）
                signature:
                    type: string
                    description: 日志数字签名（ECDSA，签名内容：tenant_id+user_id+created_at+log_hash）
                    format: bytes
                createdAt:
                    type: string
                    description: 日志创建时间
                    format: date-time
            description: 接口审计日志
        AskAiQueryRequest:
            type: object
            properties:
                question:
                    type: string
                lang:
                    type: string
                    description: 界面语言（BCP-47），决定结论 answer 的输出语言；默认 zh-CN
                withAnswer:
                    type: boolean
                    description: 是否生成自然语言结论（二次模型调用；默认 true）
                history:
                    type: array
                    items:
                        $ref: '#/components/schemas/AiQueryHistoryItem'
                    description: 对话历史（最近若干轮，建议 ≤5；用于消解追问里的指代，如"那只看 admin 的"）
            description: 智能问数 - 请求
        AskAiQueryResponse:
            type: object
            properties:
