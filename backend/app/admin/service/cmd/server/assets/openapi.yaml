        SsoLoginRequest:
            type: object
            properties:
                code:
                    type: string
                    description: IdP 回调带回的授权码
                state:
                    type: string
                    description: GetSsoLoginUrl 返回的 state
            description: |-
                OIDC 回调换令牌（免鉴权）：code+state 换本系统 JWT。
                 流程：state 验证取删 → code 在 IdP token 端点换 access_token →
                 拉 userinfo 取 email → 按邮箱在本系统查用户（未找到且允许预置时自动建）→
                 签发标准 JWT 对（refresh token 走 HttpOnly Cookie，与密码登录同形）。
                 V1 边界：SSO 登录不触发本系统 TOTP MFA 闸门（认证已在 IdP 完成）。
        StartEnrollMethodRequest:
            type: object
            properties:
                method:
                    enum:
                        - MFA_METHOD_UNSPECIFIED
                        - TOTP
                        - SMS
                        - EMAIL
                        - U2F
                        - WEBAUTHN
                        - BACKUP_CODE
                        - OTHER
                    type: string
                    format: enum
                phone:
                    type: string
                    description: 根据 method 可能需要额外参数（例如 SMS 需要 phone）
                email:
                    type: string
            description: Start enroll
        StartEnrollMethodResponse:
            type: object
            properties:
                totp:
