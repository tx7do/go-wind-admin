                    type: string
                    format: date-time
                retried:
                    type: integer
                    format: uint32
                maxRetry:
                    type: integer
                    format: uint32
                nextProcessAt:
                    type: string
                    description: 下次重试时间（archived 无）
                    format: date-time
            description: 失败任务明细（retry/archived 里的单条）
        SystemTaskScheduleEntry:
            type: object
            properties:
                taskType:
                    type: string
                    description: 任务类型名（载荷里的 handler/类型，如 tenant_expiry_scan）
                cronSpec:
                    type: string
                    description: cron 表达式
                nextEnqueueAt:
                    type: string
                    format: date-time
                prevEnqueueAt:
                    type: string
                    description: 上次入队时间；从未入队为空
                    format: date-time
            description: |-
                系统级常驻任务的调度条目（asynq SchedulerEntries 的只读投影）。
                 Prev 为零值时间表示从未入队过（调度注册后还没到第一个触发点）。
        SystemTaskStateSummary:
