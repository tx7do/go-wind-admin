worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # gzip 会缓冲整个响应体再发送，对 SSE 事件流是致命的——事件被积压、延迟、
  # 最终被丢弃或连接超时。网关全局禁用。
  gzip off;

  server {
    listen 8080;
    server_name localhost;

    # ------------------------------------------------------------------
    # SSE 端点反向代理
    # 后端 admin-service 在 docker-compose 的 app-tier 网络中暴露 7789
    # （SSE transport，path /events）。本网关把 /events 透传到该后端。
    # 独立部署时请把 upstream 改为实际后端地址。
    # ------------------------------------------------------------------
    location /events {
      proxy_pass http://admin-service:7789;

      # SSE 必需：HTTP/1.1 以支持 chunked transfer；
      # 清空 Connection 头，避免被中间件降级为短连接后立即关闭。
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # SSE 关键：关闭代理层一切缓冲与缓存。
      # 任何缓冲都会让事件在代理层积压，破坏实时性，甚至触发超时断流。
      proxy_buffering off;
      proxy_cache off;
      proxy_request_buffering off;

      # 长连接保活：nginx 默认 60s 读超时会切断 SSE，放宽至 24h。
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;

      # 透传客户端原始请求头（含 Authorization、Accept: text/event-stream），
      # 让后端 HandleAuthorize 能完成 token + stream 一致性校验。
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 本网关仅服务 SSE 端点，其余路径拒绝。
    location / {
      return 404;
    }
  }
}
