syntax = "proto3";

package identity.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

import "pagination/v1/pagination.proto";

// 套餐服务
service PlanService {
  // 查询套餐列表
  rpc List (pagination.PagingRequest) returns (ListPlanResponse) {}

  // 统计套餐数量
  rpc Count (pagination.PagingRequest) returns (CountPlanResponse) {}

  // 查询套餐详情
  rpc Get (GetPlanRequest) returns (Plan) {}

  // 创建套餐
  rpc Create (CreatePlanRequest) returns (google.protobuf.Empty) {}

  // 更新套餐
  rpc Update (UpdatePlanRequest) returns (google.protobuf.Empty) {}

  // 删除套餐
  rpc Delete (DeletePlanRequest) returns (google.protobuf.Empty) {}
}

// 套餐
message Plan {
  // 套餐版本
  enum Version {
    PLAN_VERSION_UNSPECIFIED = 0; // 未指定

    FREE = 1;       // 免费版
    STANDARD = 2;   // 标准版
    ENTERPRISE = 3; // 企业版
  }

  // 到期处置策略
  enum ExpiryPolicy {
    PLAN_EXPIRY_POLICY_UNSPECIFIED = 0; // 未指定

    READONLY = 1;     // 只读
    BLOCK_LOGIN = 2;  // 禁止登录
    FREEZE = 3;       // 自动冻结
  }

  optional int64 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "套餐ID"}
  ];  // 套餐ID

  optional string name = 2 [
    json_name = "name",
    (gnostic.openapi.v3.property) = {description: "套餐名称"}
  ]; // 套餐名称

  optional Version version = 3 [(gnostic.openapi.v3.property) = {description: "套餐版本"}]; // 套餐版本

  optional ExpiryPolicy expiry_policy = 4 [
    json_name = "expiryPolicy",
    (gnostic.openapi.v3.property) = {description: "到期处置策略"}
  ]; // 到期处置策略

  optional uint32 data_retention_days = 5 [
    json_name = "dataRetentionDays",
    (gnostic.openapi.v3.property) = {description: "数据保留周期（天）"}
  ]; // 数据保留周期（天）

  optional string description = 6 [
    json_name = "description",
    (gnostic.openapi.v3.property) = {description: "描述"}
  ]; // 描述

  optional string remark = 8 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注

  optional int64 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者ID"}]; // 创建者ID
  optional int64 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者ID"}]; // 更新者ID
  optional int64 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 套餐列表 - 答复
message ListPlanResponse {
  repeated Plan items = 1;
  int64 total = 2;
}

// 套餐数据 - 请求
message GetPlanRequest {
  oneof query_by {
    int64 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建套餐 - 请求
message CreatePlanRequest {
  Plan data = 1;
}

// 更新套餐 -请求
message UpdatePlanRequest {
  int64 id = 1;

  Plan data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,realname,username"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
}

// 删除套餐 - 请求
message DeletePlanRequest {
  oneof query_by {
    int64 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

message CountPlanResponse {
  int64 count = 1;
}
