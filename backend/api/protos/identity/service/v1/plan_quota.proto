syntax = "proto3";

package identity.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

import "pagination/v1/pagination.proto";

// 套餐配额服务
service PlanQuotaService {
  // 查询套餐配额列表
  rpc List (pagination.PagingRequest) returns (ListPlanQuotaResponse) {}

  // 统计套餐配额数量
  rpc Count (pagination.PagingRequest) returns (CountPlanQuotaResponse) {}

  // 查询套餐配额详情
  rpc Get (GetPlanQuotaRequest) returns (PlanQuota) {}

  // 创建套餐配额
  rpc Create (CreatePlanQuotaRequest) returns (google.protobuf.Empty) {}

  // 更新套餐配额
  rpc Update (UpdatePlanQuotaRequest) returns (google.protobuf.Empty) {}

  // 删除套餐配额
  rpc Delete (DeletePlanQuotaRequest) returns (google.protobuf.Empty) {}
}

// 套餐配额
message PlanQuota {
  // 配额类型
  enum QuotaType {
    PLAN_QUOTA_TYPE_UNSPECIFIED = 0; // 未指定

    USER_LIMIT = 1;       // 用户上限
    STORAGE = 2;          // 存储空间
    API_CALL = 3;         // API 调用量
    AI_TOKENS = 4;        // AI token 用量
    TEMPLATE_COUNT = 5;   // 打印模板数
  }

  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {
      description: "配额项ID"
    }
  ]; // 配额项ID

  optional uint32 plan_id = 2 [
    json_name = "planId",
    (gnostic.openapi.v3.property) = {
      description: "所属套餐ID"
    }
  ]; // 所属套餐ID

  optional QuotaType quota_type = 3 [
    json_name = "quotaType",
    (gnostic.openapi.v3.property) = {description: "配额类型"}
  ]; // 配额类型

  optional uint64 quota_value = 4 [
    json_name = "quotaValue",
    (gnostic.openapi.v3.property) = {description: "配额值"}
  ]; // 配额值

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 套餐配额列表 - 答复
message ListPlanQuotaResponse {
  repeated PlanQuota items = 1;
  uint64 total = 2;
}

// 套餐配额数据 - 请求
message GetPlanQuotaRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建套餐配额 - 请求
message CreatePlanQuotaRequest {
  PlanQuota data = 1;
}

// 更新套餐配额 -请求
message UpdatePlanQuotaRequest {
  uint32 id = 1;

  PlanQuota data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,realname,username"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
}

// 删除套餐配额 - 请求
message DeletePlanQuotaRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

message CountPlanQuotaResponse {
  uint64 count = 1;
}
