syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";

import "identity/service/v1/tenant.proto";

// 租户管理服务
service TenantService {
  // 获取租户列表
  rpc List (pagination.PagingRequest) returns (identity.service.v1.ListTenantResponse) {
    option (google.api.http) = {
      get: "/admin/v1/tenants"
    };
  }

  // 回收站：分页查询已删除（停车）租户
  //（注册序刻意置于 Get({id}) 之前——gorilla/gen-http 都是先注册者优先，
  //字面段被先注册的参数段吸收即成 shadow，挂载面直接跳过，路由就死了）
  rpc ListDeletedTenants (pagination.PagingRequest) returns (identity.service.v1.ListTenantResponse) {
    option (google.api.http) = {
      get: "/admin/v1/tenants/trash"
    };
  }

  // 回收站：恢复租户（清理删除标记并置回在营态）
  rpc RestoreTenant (identity.service.v1.RestoreTenantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{id}/restore"
      body: "*"
    };
  }

  // 回收站：彻底删除租户（硬删行与残余关联，不可逆）
  rpc PurgeTenant (identity.service.v1.PurgeTenantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/tenants/{id}/purge"
    };
  }

  // 获取租户数据
  rpc Get (identity.service.v1.GetTenantRequest) returns (identity.service.v1.Tenant) {
    option (google.api.http) = {
      get: "/admin/v1/tenants/{id}"
    };
  }

  // 创建租户
  rpc Create (identity.service.v1.CreateTenantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/tenants"
      body: "*"
    };
  }

  // 更新租户
  rpc Update (identity.service.v1.UpdateTenantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/tenants/{id}"
      body: "*"
    };
  }

  // 删除租户
  rpc Delete (identity.service.v1.DeleteTenantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/tenants/{id}"
    };
  }

  // 创建租户及管理员用户
  rpc CreateTenantWithAdminUser (identity.service.v1.CreateTenantWithAdminUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/tenants:with-admin"
      body: "*"
    };
  }

  // 租户是否存在
  rpc TenantExists (identity.service.v1.TenantExistsRequest) returns (identity.service.v1.TenantExistsResponse) {
    option (google.api.http) = {
      get: "/admin/v1/tenants:exists"
    };
  }

  // 查询租户用量与配额
  rpc GetUsage (identity.service.v1.GetTenantUsageRequest) returns (identity.service.v1.TenantUsage) {
    option (google.api.http) = {
      get: "/admin/v1/tenants/{id}/usage"
    };
  }

  // 清理租户数据
  rpc CleanupData (identity.service.v1.CleanupTenantDataRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{id}/cleanup"
      body: "*"
    };
  }

}
