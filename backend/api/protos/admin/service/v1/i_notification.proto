syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "pagination/v1/pagination.proto";

import "notification/service/v1/notification.proto";

// 通知投递台账管理服务（平台级只读视图）。
//
// 本域不含"发一条通知"的通用 HTTP 路由：SendDirect 只由进程内的业务 service 经 Notifier 接口调用。
// 把它开放成端点等于给任意已登录操作员一个"向任意邮箱发信"的能力。
// 两个刻意保留的手动触发口都是平台管理员专属、且只能发"测试文案"：
// 渠道配置页的 send-test-email，与路由规则页的 notification-rules/{id}/test-dispatch。
service NotificationService {
  // 查询投递台账列表
  rpc ListNotificationDelivery(pagination.PagingRequest) returns (notification.service.v1.ListNotificationDeliveryResponse) {
    option (google.api.http) = {
      get: "/admin/v1/notification-deliveries"
    };
  }

  // 查询投递台账详情
  rpc GetNotificationDelivery(notification.service.v1.GetNotificationDeliveryRequest) returns (notification.service.v1.NotificationDelivery) {
    option (google.api.http) = {
      get: "/admin/v1/notification-deliveries/{id}"
    };
  }
}
