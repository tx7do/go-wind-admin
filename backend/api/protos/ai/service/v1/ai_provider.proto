syntax = "proto3";

package ai.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// AI 模型提供商服务
service AiProviderService {
  // 分页查询 AI 提供商列表
  rpc List (pagination.PagingRequest) returns (ListAiProviderResponse) {}

  // 统计 AI 提供商数量
  rpc Count (pagination.PagingRequest) returns (CountAiProviderResponse) {}

  // 查询 AI 提供商详情
  rpc Get (GetAiProviderRequest) returns (AiProvider) {}

  // 创建 AI 提供商
  rpc Create (CreateAiProviderRequest) returns (google.protobuf.Empty) {}

  // 更新 AI 提供商
  rpc Update (UpdateAiProviderRequest) returns (google.protobuf.Empty) {}

  // 删除 AI 提供商
  rpc Delete (DeleteAiProviderRequest) returns (google.protobuf.Empty) {}
}

// AI 模型提供商（一行 = 一个可调用的模型端点配置）
message AiProvider {
  // 模型部署形态
  enum ModelType {
    MODEL_TYPE_UNSPECIFIED = 0; // 未指定

    LOCAL = 1; // 本地模型（Ollama 等，OpenAI 兼容端点）
    CLOUD = 2; // 云端模型（OpenAI 兼容 API）
  }

  optional int64 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {
      description: "提供商ID"
    }
  ]; // 提供商ID

  optional string name = 2 [
    json_name = "name",
    (gnostic.openapi.v3.property) = {description: "提供商显示名称，如 DeepSeek、通义千问、本地 Ollama"}
  ]; // 提供商显示名称

  optional ModelType model_type = 3 [
    json_name = "modelType",
    (gnostic.openapi.v3.property) = {description: "模型部署形态：本地 / 云端"}
  ]; // 模型部署形态

  optional string model_name = 4 [
    json_name = "modelName",
    (gnostic.openapi.v3.property) = {description: "模型名称，如 deepseek-chat、qwen-max、llama3"}
  ]; // 模型名称

  optional string base_url = 5 [
    json_name = "baseUrl",
    (gnostic.openapi.v3.property) = {description: "云端 OpenAI 兼容 API 地址，如 https://api.deepseek.com/v1"}
  ]; // 云端 API 地址

  optional string organization = 6 [
    json_name = "organization",
    (gnostic.openapi.v3.property) = {description: "OpenAI Organization（可选）"}
  ]; // Organization

  optional string api_key = 7 [
    json_name = "apiKey",
    (gnostic.openapi.v3.property) = {description: "API Key（仅写入；读取时恒为空，脱敏值见 apiKeyHint）"}
  ]; // API Key（仅写入，读取时为空）

  optional string api_key_hint = 8 [
    json_name = "apiKeyHint",
    (gnostic.openapi.v3.property) = {description: "API Key 脱敏提示（如 sk-***abcd），只读"}
  ]; // API Key 脱敏提示（只读）

  optional string local_host = 9 [
    json_name = "localHost",
    (gnostic.openapi.v3.property) = {description: "本地模型主机（Ollama），默认 localhost"}
  ]; // 本地模型主机

  optional int32 local_port = 10 [
    json_name = "localPort",
    (gnostic.openapi.v3.property) = {description: "本地模型端口，默认 11434"}
  ]; // 本地模型端口

  optional int32 timeout_seconds = 11 [
    json_name = "timeoutSeconds",
    (gnostic.openapi.v3.property) = {description: "连接超时秒数（默认 30）；流式对话时长由服务端统一控制"}
  ]; // 连接超时秒数

  optional string system_prompt = 12 [
    json_name = "systemPrompt",
    (gnostic.openapi.v3.property) = {description: "系统提示词（可选），作为对话的 system 消息"}
  ]; // 系统提示词

  optional bool is_default = 13 [
    json_name = "isDefault",
    (gnostic.openapi.v3.property) = {description: "是否为默认提供商（聊天未显式指定时使用）"}
  ]; // 是否默认提供商

  optional string remark = 14 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注

  optional bool is_enabled = 15 [
    json_name = "isEnabled",
    (gnostic.openapi.v3.property) = {description: "是否启用"}
  ]; // 是否启用

  optional int64 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional int64 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional int64 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询 AI 提供商列表 - 回应
message ListAiProviderResponse {
  repeated AiProvider items = 1;
  int64 total = 2;
}

// 查询 AI 提供商详情 - 请求
message GetAiProviderRequest {
  oneof query_by {
    int64 id = 1;
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器
}

// 创建 AI 提供商 - 请求
message CreateAiProviderRequest {
  AiProvider data = 1;
}

// 更新 AI 提供商 - 请求
message UpdateAiProviderRequest {
  int64 id = 1;

  AiProvider data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表"
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    json_name = "allowMissing"
  ]; // 资源不存在则新增
}

// 删除 AI 提供商 - 请求
message DeleteAiProviderRequest {
  oneof query_by {
    int64 id = 1;
  }
}

message CountAiProviderResponse {
  int64 count = 1; // 提供商数量
}
