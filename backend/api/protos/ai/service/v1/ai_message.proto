syntax = "proto3";

package ai.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// AI 对话消息服务
service AiMessageService {
  // 分页查询消息列表
  rpc List (pagination.PagingRequest) returns (ListAiMessageResponse) {}

  // 统计消息数量
  rpc Count (pagination.PagingRequest) returns (CountAiMessageResponse) {}

  // 删除消息
  rpc Delete (DeleteAiMessageRequest) returns (google.protobuf.Empty) {}
}

// 消息角色
enum AiRole {
  AI_ROLE_UNSPECIFIED = 0; // 未指定

  USER = 1;      // 用户消息
  ASSISTANT = 2; // 模型回复
  SYSTEM = 3;    // 系统提示词
}

// AI 对话消息
message AiMessage {
  optional int64 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {
      description: "消息ID"
    }
  ]; // 消息ID

  optional int64 conversation_id = 2 [
    json_name = "conversationId",
    (gnostic.openapi.v3.property) = {description: "所属会话ID"}
  ]; // 所属会话ID

  optional AiRole role = 3 [
    json_name = "role",
    (gnostic.openapi.v3.property) = {description: "消息角色"}
  ]; // 消息角色

  optional string content = 4 [
    json_name = "content",
    (gnostic.openapi.v3.property) = {description: "消息正文（Markdown）"}
  ]; // 消息正文

  optional string model_name = 5 [
    json_name = "modelName",
    (gnostic.openapi.v3.property) = {description: "生成该回复的模型名称快照"}
  ]; // 模型名称快照

  optional uint32 prompt_tokens = 6 [
    json_name = "promptTokens",
    (gnostic.openapi.v3.property) = {description: "输入 token 数"}
  ]; // 输入 token 数

  optional uint32 completion_tokens = 7 [
    json_name = "completionTokens",
    (gnostic.openapi.v3.property) = {description: "输出 token 数"}
  ]; // 输出 token 数

  optional uint32 duration_ms = 8 [
    json_name = "durationMs",
    (gnostic.openapi.v3.property) = {description: "生成耗时（毫秒）"}
  ]; // 生成耗时

  optional string error_message = 9 [
    json_name = "errorMessage",
    (gnostic.openapi.v3.property) = {description: "生成失败原因（仅失败记录）"}
  ]; // 失败原因

  optional int64 user_id = 10 [
    json_name = "userId",
    (gnostic.openapi.v3.property) = {description: "归属用户ID"}
  ]; // 归属用户ID

  optional int64 tenant_id = 11 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ]; // 租户ID

  optional int64 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional int64 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional int64 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询消息列表 - 回应
message ListAiMessageResponse {
  repeated AiMessage items = 1;
  int64 total = 2;
}

// 删除消息 - 请求
message DeleteAiMessageRequest {
  oneof query_by {
    int64 id = 1;
  }
}

message CountAiMessageResponse {
  int64 count = 1; // 消息数量
}
