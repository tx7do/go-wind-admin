syntax = "proto3";

package notification.service.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "go-wind-admin/api/gen/go/notification/service/v1;notificationv1";

// 通知模板：可复用的标题/正文占位模板（{{var}}），平台全局、code 全局唯一。
message NotificationTemplate {
  optional int64 id = 1;
  optional string name = 2 [(validate.rules).string = {min_len: 1, max_len: 100}];
  // 模板编码，发送方以 template_code 引用；全局唯一，仅限字母数字与下划线/连字符
  optional string code = 3 [(validate.rules).string = {pattern: "^[A-Za-z0-9_-]{1,64}$"}];
  // 标题模板，支持 {{var}} 占位符；未识别占位符在渲染时报错
  optional string title_template = 4 [(validate.rules).string = {min_len: 1, max_len: 500}];
  // 正文模板，支持 {{var}} 占位符
  optional string content_template = 5 [(validate.rules).string = {min_len: 1, max_len: 20000}];
  optional bool is_enabled = 6;
  optional string remark = 7 [(validate.rules).string.max_len = 500];
  optional google.protobuf.Timestamp created_at = 14;
  optional google.protobuf.Timestamp updated_at = 15;
}

message GetNotificationTemplateRequest {
  oneof query_by {
    int64 id = 1;
    string code = 2;
  }
}

message CreateNotificationTemplateRequest {
  NotificationTemplate data = 1;
}

message UpdateNotificationTemplateRequest {
  int64 id = 1;
  NotificationTemplate data = 2;
  // 字段掩码：留空更新全部字段
  optional google.protobuf.FieldMask update_mask = 3;
}
message DeleteNotificationTemplateRequest {
  int64 id = 1;
}

message ListNotificationTemplateResponse {
  int64 total = 1;
  repeated NotificationTemplate items = 2;
}

// 按变量集试渲染（管理页预览；发送不经过这里）
message RenderNotificationTemplateRequest {
  // 被渲染的模板 ID
  int64 id = 1;
  // 变量集：占位符名 → 值；模板引用了变量集里没有的占位符时整个渲染报错
  map<string, string> variables = 2;
}

message RenderNotificationTemplateResponse {
  string title = 1;
  string content = 2;
}
