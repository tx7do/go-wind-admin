syntax = "proto3";

package monitor_alert.service.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "notification/service/v1/notification.proto";
import "validate/validate.proto";

option go_package = "go-wind-admin/api/gen/go/monitor_alert/service/v1;monitoralertv1";

// 监控指标（评估器支持的全集；新增指标 = 枚举加值 + evaluator 补取数分支）
enum MonitorMetric {
  MONITOR_METRIC_UNSPECIFIED = 0;
  // Go goroutine 数量
  GO_GOROUTINES = 1;
  // Go 堆内存分配（MB）
  GO_MEM_ALLOC_MB = 2;
  // 数据库当前打开连接数
  DB_OPEN_CONNECTIONS = 3;
  // 数据库连通性失败（布尔指标：越限即 ping 失败，op/threshold 被忽略）
  DB_PING_FAIL = 4;
  // Redis 逻辑库 key 总数（DBSIZE）
  REDIS_DB_SIZE = 5;
}

// 比较运算
enum AlertOp {
  ALERT_OP_UNSPECIFIED = 0;
  // 当前值 >= 阈值
  GE = 1;
  // 当前值 <= 阈值
  LE = 2;
}

// 监控告警规则：指标阈值 → 触发通知。
// 渠道与目标显式写在规则上（不经路由表）：告警是"点对点"的运营配置，
// 路由表解决的是"事件该发去哪类渠道"，而这里要的是"这条告警发到这个邮箱"。
message MonitorAlertRule {
  optional int64 id = 1;
  optional string name = 2 [(validate.rules).string = {min_len: 1, max_len: 100}];
  optional monitor_alert.service.v1.MonitorMetric metric = 3;
  // DB_PING_FAIL 时忽略 op/threshold
  optional monitor_alert.service.v1.AlertOp op = 4;
  optional double threshold = 5;
  // 重复告警冷却（分钟）：持续越限时按此间隔重发，默认 30
  optional uint32 cooldown_minutes = 6 [(validate.rules).uint32 = {lte: 1440}];
  // 告警渠道（显式指定）
  optional notification.service.v1.Channel channel = 7;
  // 投递目标：EMAIL 为收件地址，WEBHOOK 为回调 URL
  optional string target = 8 [(validate.rules).string = {min_len: 3, max_len: 500}];
  optional bool is_enabled = 9;
  optional string remark = 10 [(validate.rules).string.max_len = 500];
  // —— 以下为评估器回写状态（只读） ——
  optional bool last_firing = 14;
  optional double last_value = 15;
  optional google.protobuf.Timestamp last_alerted_at = 16;
  optional google.protobuf.Timestamp updated_at = 17;
}

message GetMonitorAlertRuleRequest {
  int64 id = 1;
}

message CreateMonitorAlertRuleRequest {
  MonitorAlertRule data = 1;
}

message UpdateMonitorAlertRuleRequest {
  int64 id = 1;
  MonitorAlertRule data = 2;
  optional google.protobuf.FieldMask update_mask = 3;
}

message DeleteMonitorAlertRuleRequest {
  int64 id = 1;
}

message ListMonitorAlertRuleResponse {
  int64 total = 1;
  repeated MonitorAlertRule items = 2;
}

// 手动触发一轮评估（管理页「立即评估」）；返回各启用规则的求值结论
message EvaluateMonitorAlertsRequest {}

message EvaluateMonitorAlertsResponse {
  message RuleOutcome {
    int64 rule_id = 1;
    string name = 2;
    // 本次扫描是否越限
    bool firing = 3;
    // 本次扫描实际读到的指标值（采集失败为空）
    optional double current_value = 4;
    // 本轮是否发出了通知（首次触发 / 冷却到期重发 / 恢复）
    bool notified = 5;
    // 未发通知的原因（未越限未恢复 / 冷却中 / 采集失败）
    optional string reason = 6;
  }
  repeated RuleOutcome outcomes = 1;
}
