syntax = "proto3";

package print.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";


// 打印模板服务
service PrintTemplateService {
  // 分页查询打印模板列表
  rpc List (pagination.PagingRequest) returns (ListPrintTemplateResponse) {}

  // 查询打印模板详情
  rpc Get (GetPrintTemplateRequest) returns (PrintTemplate) {}

  // 创建打印模板
  rpc Create (CreatePrintTemplateRequest) returns (google.protobuf.Empty) {}

  // 更新打印模板
  rpc Update (UpdatePrintTemplateRequest) returns (google.protobuf.Empty) {}

  // 删除打印模板
  rpc Delete (DeletePrintTemplateRequest) returns (google.protobuf.Empty) {}
}

// 打印模板（单据打印设计器的 TemplateData 载体；租户隔离，内置模板禁删可复制）
message PrintTemplate {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {
      description: "模板ID"
     }
  ]; // 模板ID

  optional string name = 2 [
    json_name = "name",
    (gnostic.openapi.v3.property) = {description: "模板名称（展示用）"}
  ]; // 模板名称

  optional string code = 3 [
    json_name = "code",
    (gnostic.openapi.v3.property) = {description: "模板编码，租户内唯一，业务侧按编码取模板"}
  ]; // 模板编码

  optional string resource_key = 4 [
    json_name = "resourceKey",
    (gnostic.openapi.v3.property) = {description: "绑定资源标识（对应菜单/资源的 generated service 键，设计器字段面板据其拉字段 schema）"}
  ]; // 绑定资源标识

  optional string payload = 5 [
    json_name = "payload",
    (gnostic.openapi.v3.property) = {description: "模板 JSON（设计器 TemplateData：毫米布局 + schemaVersion，服务端不解析只透传）"}
  ]; // 模板 JSON

  optional bool is_built_in = 6 [
    json_name = "isBuiltIn",
    (gnostic.openapi.v3.property) = {description: "是否系统内置模板（内置禁删，可复制派生）"}
  ]; // 是否系统内置模板

  optional string paper_size = 7 [
    json_name = "paperSize",
    (gnostic.openapi.v3.property) = {description: "纸张尺寸冗余列（A4/A5/80mm 等，列表页直显免解析 JSON）"}
  ]; // 纸张尺寸

  optional string orientation = 8 [
    json_name = "orientation",
    (gnostic.openapi.v3.property) = {description: "纸张方向冗余列（portrait/landscape）"}
  ]; // 纸张方向

  optional bool is_enabled = 9 [
    json_name = "isEnabled",
    (gnostic.openapi.v3.property) = {description: "是否启用，停用的模板不出现在业务打印入口"}
  ]; // 是否启用

  optional uint32 sort_order = 10 [
    json_name = "sortOrder",
    (gnostic.openapi.v3.property) = {description: "排序序号"}
  ]; // 排序序号

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者ID"}]; // 创建者ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者ID"}]; // 更新者ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询打印模板列表 - 回应
message ListPrintTemplateResponse {
  repeated PrintTemplate items = 1;
  uint64 total = 2;
}

// 查询打印模板 - 请求
message GetPrintTemplateRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建打印模板 - 请求
message CreatePrintTemplateRequest {
  PrintTemplate data = 1;
}

// 更新打印模板 - 请求
message UpdatePrintTemplateRequest {
  uint32 id = 1;

  PrintTemplate data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,name,payload"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 资源不存在则新增
}

// 删除打印模板 - 请求
message DeletePrintTemplateRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}
